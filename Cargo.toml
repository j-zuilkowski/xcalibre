[workspace]
members = [
    "processing",
    "api",
    "src-tauri",
    "xcalibre-plugin-sdk",
    "xcalibre-epub",
    "xcalibre-ai",
]
resolver = "2"

[workspace.dependencies]
anyhow = { version = "1.0" }
tokio = { version = "1.0", features = ["fs", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "macros"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }
