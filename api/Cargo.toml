[package]
name = "xcalibre-api"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow     = "1"
reqwest    = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
tracing    = "0.1"
keyring    = "2"
thiserror  = "1"
