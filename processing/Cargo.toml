[package]
name = "xcalibre-processing"
version = "1.0.0"
edition = "2021"

[dependencies]
tempfile = "3"
flate2 = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
zip = "0.6"
roxmltree = "0.20"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.34"
mobi = "0.7"
scraper = "0.20"
quick-xml = { version = "0.36", features = ["serialize"] }
encoding_rs = "0.8"
xcalibre-api = { path = "../api" }
dirs = "5"
toml = "0.8"
keyring = "2"
walkdir = "2"
chmlib = "1.0.0"

[dev-dependencies]
flate2 = "1"
tempfile = "3"
wiremock = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

[[bench]]
name = "db_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false
[[test]]
name = "tcr_text_tests"
path = "tests/tcr_text_tests.rs"
[[test]]
name = "snb_text_tests"
path = "tests/snb_text_tests.rs"
[[test]]
name = "lrf_tests"
path = "tests/lrf_tests.rs"
[[test]]
name = "djvu_tests"
path = "tests/djvu_tests.rs"
[[test]]
name = "azw4_text_tests"
path = "tests/azw4_text_tests.rs"
[[test]]
name = "lit_text_tests"
path = "tests/lit_text_tests.rs"
[[test]]
name = "txt_pipeline_tests"
path = "tests/txt_pipeline_tests.rs"
[[test]]
name = "cbz_cover_tests"
path = "tests/cbz_cover_tests.rs"
[[test]]
name = "pdb_ereader_tests"
path = "tests/pdb_ereader_tests.rs"
[[test]]
name = "test_search_parser"
path = "tests/test_search_parser.rs"
[[test]]
name = "test_search_execution"
path = "tests/test_search_execution.rs"
[[test]]
name = "test_plugin_sdk"
path = "tests/test_plugin_sdk.rs"
[[test]]
name = "test_plugin_loader"
path = "tests/test_plugin_loader.rs"
