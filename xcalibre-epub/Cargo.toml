[package]
name = "xcalibre-epub"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror  = "1"
roxmltree  = "0.20"
quick-xml  = { version = "0.36", features = ["serialize"] }
zip        = "2"
image      = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
regex      = "1"

[dev-dependencies]
tempfile = "3"
